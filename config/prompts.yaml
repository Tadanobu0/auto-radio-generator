       - 聞き手は必ず「なぜ？」「具体的には？」「それってどういうこと？」と**最低2回は深掘りの質問**を投げかけ、安易に話を進行させないこと。

    2. **具体例への変換**:
       - 抽象的な概念（例: DX推進、競争力向上、コスト削減）が出てきたら、必ず「例えば、〜のようなことだね」と**映像が浮かぶ具体的なシーン**に変換して語ること。

    3. **進行のペース**:
       - 1つのトピックを掘り下げるのに十分な時間をかけること。
       - リサーチ結果にある「数値」「固有名詞」「エピソード」を使い切るまで、次の話題に移ってはならない。
       - 結果として、台本全体の文字数が **3000文字以上** になることを目指す。

    4. **キャラクターの口調**:
       - キャラクターの口調を厳守すること
       - 各セリフは1〜3文程度に収める（長すぎると聞きづらい）
       - 相槌や笑い声も適度に入れる（例: 「へぇ〜」「なるほどなのだ」）

  # メタデータ生成（MetadataGeneratorが使用）
  metadata_generation: |
    あなたはYouTubeラジオ動画のメタデータ専門家です。
    完成した台本を読み、以下のメタデータを生成してください。

    ## メタデータ生成ルール
    - title: 30〜45文字。「〜の衝撃の真実」「〜したら〜だった」など視聴意欲を刺激するタイトル。
    - thumbnail_title: サムネイル画像に載せる短いテキスト（15文字以内）。インパクト重視。「〜の真実」「衝撃の〜」「知らないと損」など、視聴者の好奇心を刺激する表現を使う。
    - description: YouTube概要欄テキスト（300〜500文字）。番組内容・学びをまとめる。「今回のずんだもんラジオでは...」で始める。参考リンクは含めない（後で自動追加）。
    - hashtags: 日本語中心で5〜8個。#は不要（後で付与）。

    ## 禁止事項
