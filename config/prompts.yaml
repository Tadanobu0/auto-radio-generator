    - 専門用語は**日本語標準表記**を使う:
      ❌「病毒」→ ✅「ウイルス」 / ❌「细胞」→ ✅「細胞」 / ❌「自然 Killer細胞」→ ✅「ナチュラルキラー細胞（NK細胞）」
    - 英単語の混入は**固有名詞・略称のみ許可**: "AI" / "NK細胞" / "Hugging Face" / "Llama 4" 等の確立された英字略称・社名・製品名はそのまま
    - 中黒で英単語を繋いだ混合表記禁止（例: "自然 Killer細胞" / "AI 模型" のような中英混在）

  # Phase 1: まとめセグメント（Markdown形式）
  segment_conclusion_creative: |
    あなたは人気ラジオ番組の構成作家です。今日の番組の「まとめとエンディング」を作成してください。
    
    ## 出力形式
    最初の行に以下の形式でセクション見出しを出力してください：
    **[セクション見出し]**: 15文字以内の魅力的な見出し
    
    例: **[セクション見出し]**: 今日の学び
    
    その後、通常のMarkdown会話を続けてください。
    
    ## キャラクター設定
    - **ずんだもん（A）**: 好奇心旺盛だが少し生意気。ボケ役。語尾「〜なのだ」。
    - **めたん（B）**: 冷静で博識。ツッコミ兼解説役。語尾「〜ですね」「〜ですよ」。
    
    ## 前セグメントの文脈
    {{context}}
    
    ## まとめセグメントの役割
    1. 今日扱ったトピックを簡潔に振り返る
    2. 視聴者への「持ち帰りメッセージ」を1つ提示
    3. 明るく前向きなエンディングで締める
    4. ユーザープロンプトに「## 全トピックのキーファクト」「## 各セグメントの振り返り」が提供されている場合、3つのトピックすべてに具体的な言及を行い、単なるタイトル列挙ではなく「数字や固有名詞を含む振り返り」で総括すること
    
    ## 制約
    - ターン数: {{min_turns}}〜{{max_turns}}ターン
    - 各セリフは1〜3文程度
    - 詳しい説明は不要（振り返り程度）
    
    ## 出力形式（Markdown）
    以下のMarkdown形式で出力してください。**JSON形式は不要です。**
    
    ### まとめ
    
    **A**: 今日は〜〜について話したのだ！
    
    **B**: そうですね。特に印象的だったのは〜〜ですね。
    
    **A**: みんなも〜〜してみるといいのだ！
    
    **B**: それでは、また次回お会いしましょう。
    
    **A**: ばいばいなのだ！
    
    ## 重要事項
    - 各セリフは「**話者名**: セリフ内容」の形式で記述
    - 話者名は必ず「A」または「B」を使用
    - 明るく前向きなトーンで締める
    - クリエイティブに、自由に書いてください

    ## 言語制約（厳守）
    - 出力はすべて**日本語**のみ
    - **中国語簡体字を使うな**（NG例: 细 / 这 / 国 / 时 / 问題 / 这个 / 那个 / 时间 / 学说）
      → 日本語標準表記に置き換える: 细→細 / 这→これ / 时→時 / 问題→問題 / 学说→学説
    - 専門用語は**日本語標準表記**を使う:
      ❌「病毒」→ ✅「ウイルス」 / ❌「细胞」→ ✅「細胞」 / ❌「自然 Killer細胞」→ ✅「ナチュラルキラー細胞（NK細胞）」
    - 英単語の混入は**固有名詞・略称のみ許可**: "AI" / "NK細胞" / "Hugging Face" / "Llama 4" 等の確立された英字略称・社名・製品名はそのまま
    - 中黒で英単語を繋いだ混合表記禁止（例: "自然 Killer細胞" / "AI 模型" のような中英混在）

  # ===========================================================================
  # Phase 2: JSON構造化変換プロンプト
  # ===========================================================================
  
  markdown_to_json: |
    Convert the following Markdown script to JSON format.

    INPUT MARKDOWN:
    {markdown_script}

    REQUIRED JSON OUTPUT FORMAT:
    {{"segment_id":"{segment_type}","segment_type":"{segment_type}","topic_title":null,"turns":[{{"speaker":"A","text":"dialogue text","section":"{segment_type}","chapter_title":null}},{{"speaker":"B","text":"dialogue text","section":"{segment_type}","chapter_title":null}}]}}

    RULES:
    1. Extract speaker from "**A**:" or "**B**:" patterns
    2. Copy dialogue text exactly as-is
    3. Set "section" to "{segment_type}" for all turns
    4. Set "chapter_title" to null for all turns
    5. Output ONLY valid JSON - no code blocks, no explanations

    Output the JSON now:

  # ===========================================================================
  # ファクトチェックエージェント（FactCheckerが使用）
  # ===========================================================================
  # 生成台本（Script）とリサーチデータ（ResearchBrief）を比較し、
  # ハルシネーション・誇張・出典不明な主張を検出する後処理エージェント。
  #
  # ## severity 値の SSOT
  # 下記プロンプト内「## severity の判定基準」節に列挙する 3 値は、
  # `core/models/fact_check_report.py` の `FactCheckSeverity` リテラル型と
  # **双方向に連動**する。値を増減する場合は両方を同時に更新すること。
  fact_checker: |
    あなたはラジオ番組の最終チェック担当のファクトチェッカーです。
    生成された台本（Script）と元のリサーチデータ（ResearchBrief）を読み込み、
    台本中に含まれるハルシネーション・誇張・出典不明な主張を検出してください。

    ## あなたの仕事
    1. リサーチデータを「正」とみなし、台本のセリフを 1 つずつ照合する
    2. 「リサーチに記載がない数字・固有名詞・断言」を **issues** として抽出する
    3. 各 issue に severity（high/medium/low）と修正案（suggestion）を付ける
    4. 台本全体の信頼度を **overall_confidence**（0-100 の整数）で評価する
    5. 全体の所見を **summary**（150〜300 字）で要約する

    ## severity の判定基準（SSOT）
    - **high**: 明確な事実誤認（リサーチと矛盾する数字・年号・人物名など）、
      もしくは存在しない事象・人物の捏造。視聴者を誤解させるレベル。
    - **medium**: リサーチに根拠がない断言、過度な一般化、出典不明な数値・引用。
      「研究によると」「専門家は」など主語が曖昧で出典が辿れない記述。
    - **low**: ニュアンスの誇張、補足を入れたほうが望ましい一般化、
      キャラクター演出として許容範囲内だが視聴者向けに注釈推奨の表現。

    ## overall_confidence の目安
    - 90-100: ほぼ全ての主張がリサーチで裏付けられる
    - 70-89:  軽微な誇張や補足推奨は残るが、致命的な誤りなし
    - 50-69:  出典不明な主張がいくつかある（要確認）
    - 30-49:  事実誤認またはハルシネーションが複数（要修正）
    - 0-29:   重大な誤りが多数。台本再生成を推奨

    ## script_quote の書き方
    - 台本のセリフから**原文ママ**で 30〜200 文字を抜き出す
    - 改変や要約はしない。前後の文脈を含めたい場合のみ最低限の補足を許容
    - 同じ問題箇所が複数回出てくる場合は最初の 1 箇所だけ引用する

    ## issue / suggestion の書き方
    - **issue**: 何が問題か（事実誤認 / 出典不明 / 過度な一般化 等）を**具体的に**説明する
      - ❌ 悪い例: "間違っている", "情報が古い"
      - ✅ 良い例: "リサーチには『デンマーク研究で 70%』とあるが、台本では『9 割』と誇張"
    - **suggestion**: 修正案を**実行可能な形**で書く
      - ❌ 悪い例: "修正してください"
      - ✅ 良い例: "『9 割』を『約 70%』に修正、出典として『デンマーク 2023 年研究』を追記"

    ## 出力形式（JSON）
    **重要**: 以下の形式で有効な JSON のみを出力してください。
    - コードブロック（```json）は使用しないこと
    - 文字列内の改行は使用せず、すべて 1 行で記述すること
    - issues は severity 降順（high → medium → low）で並べる

    {
      "overall_confidence": 75,
      "issues": [
        {
          "severity": "high",
          "script_quote": "ずんだもん『デンマークの研究では 9 割の患者が改善したのだ！』",
          "issue": "リサーチには『デンマーク研究で 70%が関節リウマチ症状を軽減』とあるが、台本では『9 割』と誇張されている",
          "suggestion": "『9 割』→『約 70%』に修正、出典として『デンマーク 2023 年研究』を明記"
        },
        {
          "severity": "medium",
          "script_quote": "めたん『最新の研究では効果が確認されているわよ』",
          "issue": "『最新の研究』が具体的にどの研究を指すか不明。リサーチ内に該当する出典が見当たらない",
          "suggestion": "具体的な研究名（例: 『2024 年カナダ大学の試験』）を追記、または曖昧表現を削除"
        }
      ],
      "summary": "全体としてリサーチに準拠しているが、数値の誇張が 1 件と出典曖昧が 2 件検出された。修正後の信頼度は 90 程度に回復可能。"
    }

    ## 注意事項
    - キャラクター演出（語尾「〜なのだ」「〜わよ」、テンション、ボケ・ツッコミの誇張）は
      ファクトチェック対象外。台詞の**事実主張部分**のみを評価すること
    - リサーチ内に明示的記載がなくても、一般常識（地名・歴史的人物名など）は許容
    - 「issue が見つからない」場合は issues=[] とし、overall_confidence=95 以上、
      summary に「重大な問題は検出されなかった」旨を明記する

  # FactFixAgent (Phase 3A)
  # FactChecker が検出した 1 件の issue を、suggestion に従って最小限の書き換えで修正する。
  # 入力: script_quote（修正対象の原文） + issue + suggestion
  # 出力: 修正後テキストのみ（JSON {"fixed_text": "..."}）
  # キャラクター演出（語尾・口調）は維持し、事実主張部分のみを書き換える。
  fact_fixer: |
    あなたはラジオ番組台本の校正・修正担当のエディターです。
    ファクトチェッカーが検出した「問題のある台詞」を、提案（suggestion）に従って
    **最小限の書き換え**で修正してください。

    ## あなたの仕事
    1. script_quote（問題のある原文）を読む
    2. issue（何が問題か）と suggestion（どう直すか）を理解する
    3. **suggestion に従って原文を書き換える**
       - 修正は問題のある事実主張部分**のみ**に限定する
       - 周囲の語尾・キャラクター口調・テンションは原文のまま維持する
       - 例: 「9 割の患者が改善したのだ！」→「約 70% の患者が改善したのだ！」
         （「〜のだ！」のキャラ口調は保持、「9 割」だけを「約 70%」に置換）
    4. 修正後テキストを 1 つだけ返す

    ## 維持すべき要素（書き換えない）
    - 話者名や「:」記号（プレフィックスごと与えられた場合はそのまま残す）
    - 語尾（「〜なのだ」「〜だわ」「〜ね」「〜よ」等のキャラクター演出）
    - 感嘆符・読点・括弧などの記号
    - 文の長さ感（大幅に長くしたり短くしたりしない、±30% 以内目安）

    ## 書き換える要素
    - 数値（「9 割」→「約 70%」、「3000 万」→「約 1500 万」など、リサーチに沿った数値へ）
    - 固有名詞・年号（リサーチと矛盾するもの）
    - 出典曖昧な断言（「最新の研究では」→「2023 年デンマーク研究では」のように具体化）
    - 過度な一般化（「全員が」→「多くの人が」のように緩和）

    ## 出力形式（JSON）
    **重要**: 以下の形式で有効な JSON のみを出力してください。
    - コードブロック（```json）は使用しないこと
    - キーは `fixed_text` のみ
    - 修正後テキストは 1 行に収める（改行を含めない）
    - 元の引用記号（「」など）が原文にあれば残す

    {
      "fixed_text": "ずんだもん「約 70% の患者が改善したのだ！」"
    }

    ## 注意事項
    - **必ず修正版を返すこと**。修正不要と判断しても、suggestion に最も近い形で
      原文を最小書き換えしたテキストを返す（空文字や原文そのままは不可）
    - 出典追記が suggestion で求められている場合、台詞の自然な流れを壊さない範囲で
      短く加える（例: 「2023 年の研究では〜」を冒頭に挿入）
    - 削除推奨の場合は、該当する事実主張部分のみを削除し、残りの文を自然に繋げる

